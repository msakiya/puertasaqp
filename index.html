<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puertas Automáticas de Garaje en Arequipa | Todo Puertas</title>
  <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>
  <script src="catalogo-motores.js"></script>
  <script>
    (async function () {
      const sources = [
        'https://cdn.jsdelivr.net/gh/msakiya/puertasaqp@0a21d50d9823489e5814c73318635426d564ae5d/index.html',
        'https://raw.githubusercontent.com/msakiya/puertasaqp/0a21d50d9823489e5814c73318635426d564ae5d/index.html'
      ];
      let html = null;
      for (const url of sources) {
        try {
          const res = await fetch(url, { cache: 'no-store' });
          if (res.ok) {
            html = await res.text();
            if (html && html.length > 1000) break;
          }
        } catch (e) { }
      }
      if (!html || html.length < 1000) {
        document.body.innerHTML = '<p style="font-family:sans-serif;padding:2rem">No se pudo cargar la página. Recarga en unos segundos.</p>';
        return;
      }

      const socialBlock = '<div class="flex items-center gap-3 pt-2" aria-label="Redes sociales">' +
        '<a href="https://www.facebook.com/todopuertasarequipa/" target="_blank" rel="noopener noreferrer" aria-label="Facebook de Todo Puertas Arequipa" title="Facebook" class="inline-flex size-10 items-center justify-center rounded-md bg-white/10 text-white transition hover:bg-[#1877F2]"><i class="fa-brands fa-facebook-f text-lg"></i></a>' +
        '<a href="https://www.youtube.com/channel/UChZ9FEQuyl-pZiUJOsYUwqA" target="_blank" rel="noopener noreferrer" aria-label="YouTube de Todo Puertas Arequipa" title="YouTube" class="inline-flex size-10 items-center justify-center rounded-md bg-white/10 text-white transition hover:bg-[#FF0000]"><i class="fa-brands fa-youtube text-lg"></i></a>' +
        '</div>';
      const marker = 'class="text-sm font-semibold text-yellow">Ventas e instalaciones';
      const idx = html.indexOf(marker);
      if (idx !== -1) {
        const end = html.indexOf('</p>', idx);
        if (end !== -1) html = html.slice(0, end + 4) + socialBlock + html.slice(end + 4);
      }
      html = html.replace(
        '<p>Soporte oficial: <a href="https://todopuertasarequipa.com" class="text-yellow underline">todopuertasarequipa.com</a></p>',
        '<div class="flex items-center gap-4"><a href="https://www.facebook.com/todopuertasarequipa/" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 hover:text-yellow" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i> Facebook</a><a href="https://www.youtube.com/channel/UChZ9FEQuyl-pZiUJOsYUwqA" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 hover:text-yellow" aria-label="YouTube"><i class="fa-brands fa-youtube"></i> YouTube</a><p>Soporte oficial: <a href="https://todopuertasarequipa.com" class="text-yellow underline">todopuertasarequipa.com</a></p></div>'
      );
      html = html.replace(/<a href="mailto:marcos@todopuertasarequipa\.com"[^>]*>marcos@todopuertasarequipa\.com<\/a>/g, '<a href="mailto:todopuertasarequipa@gmail.com" class="text-blue">todopuertasarequipa@gmail.com</a><br><a href="mailto:info@todopuertasarequipa.com" class="text-blue">info@todopuertasarequipa.com</a>');
      html = html.replace(/marcos@todopuertasarequipa\.com/g, 'todopuertasarequipa@gmail.com');
      html = html.replace(/<p><i class="fa-solid fa-envelope mr-2 text-yellow"><\/i><a href="mailto:[^"]+" class="hover:text-yellow">[^<]+<\/a><\/p>/, '<p><i class="fa-solid fa-envelope mr-2 text-yellow"></i><a href="mailto:todopuertasarequipa@gmail.com" class="hover:text-yellow">todopuertasarequipa@gmail.com</a></p><p><i class="fa-solid fa-envelope mr-2 text-yellow"></i><a href="mailto:info@todopuertasarequipa.com" class="hover:text-yellow">info@todopuertasarequipa.com</a></p>');
      html = html.replace(/Emergencias, cotizaciones e instalaciones: las 24 horas, los 7 días\./g, 'Nuestro horario es flexible y extendido, para cotizaciones o reparaciones escribanos al WhatsApp 959325030');
      const zonas = ['Arequipa','Moquegua','Ilo','Tacna','Puno','Juliaca','Cusco','Madre de Dios','Puerto Maldonado','Todo el Perú'];
      const zonasHTML = zonas.map(function(z){return '<span class="rounded-full border border-white/15 bg-white/10 px-3 py-1 text-xs font-semibold">'+z+'</span>';}).join('');
      const zonasStart = html.indexOf('<div class="mt-3 flex flex-wrap gap-2">');
      if (zonasStart !== -1) {
        const wrapEnd = html.indexOf('</div>', zonasStart);
        if (wrapEnd !== -1) html = html.slice(0, zonasStart) + '<div class="mt-3 flex flex-wrap gap-2">' + zonasHTML + html.slice(wrapEnd);
      }

      html = html.replace(/src="images\/hero\.jpg" alt="[^"]*"/g, 'src="images/instalacion-de-puerta-garage-arequipa-2.jpg" alt="Instalación de puerta de garage en Arequipa - puerta seccional automática"');
      html = html.replace(/src="https:\/\/images\.unsplash\.com\/photo-1513694203232-719a280e022f[^"']*" alt="[^"]*"/g, 'src="images/instalacion-de-puerta-garage-arequipa-1.png" alt="Instalación de puerta de garage en Arequipa - fabricación a medida"');
      html = html.replace(/max-w-6xl/g, 'max-w-[90rem]');

      if (window.TPA_CATALOGO) {
        const motoresStart = html.indexOf('<section id="motores"');
        const motoresEnd = motoresStart !== -1 ? html.indexOf('</section>', motoresStart) : -1;
        if (motoresStart !== -1 && motoresEnd !== -1) {
          html = html.slice(0, motoresStart) + window.TPA_CATALOGO + html.slice(motoresEnd);
        }
      }

      document.open(); document.write(html); document.close();
    })();
  </script>
</body>
</html>
